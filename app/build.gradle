plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.lisan.keyboard'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'app.lisan.keyboard'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin { jvmToolchain(17) }
    buildFeatures { compose true; buildConfig true }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Arabic diacritization model (rawi-ensemble, Apache-2.0, TigreGotico) fetched at build time
// so it does not need to live in the repository. The app runs it fully offline.
def tashkeelDir = file("src/main/assets/tashkeel")
tasks.register('downloadTashkeelModel') {
    doLast {
        tashkeelDir.mkdirs()
        ['rawi_ensemble.int8.onnx', 'vocab.json'].each { name ->
            def target = new File(tashkeelDir, name)
            if (!target.exists() || target.length() == 0) {
                def url = new URL("https://huggingface.co/TigreGotico/rawi-ensemble/resolve/main/${name}")
                def tmp = new File(tashkeelDir, name + '.part')
                url.openStream().withCloseable { input -> tmp.withOutputStream { it << input } }
                if (tmp.length() == 0) throw new GradleException("Empty download: ${name}")
                tmp.renameTo(target)
                println "Downloaded ${name} (${target.length()} bytes)"
            }
        }
    }
}
tasks.configureEach { t ->
    if (t.name == 'preBuild') t.dependsOn('downloadTashkeelModel')
}
