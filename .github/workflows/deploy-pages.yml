name: Deploy Web Studio to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Locate web-studio
        id: locate
        run: |
          DIR=$(find . -type d -name "web-studio" -not -path "*/node_modules/*" -not -path "./.git/*" | head -n 1)
          if [ -z "$DIR" ]; then
            echo "web-studio not found. Folders in repo:"
            find . -maxdepth 3 -type d -not -path "./.git*" -not -path "*/node_modules*"
            exit 1
          fi
          echo "Found: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Install & Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if ls vite.config.* >/dev/null 2>&1; then
            npm run build -- --base=/${{ github.event.repository.name }}/
          else
            npm run build
          fi
          if [ -d dist ]; then OUT=dist; elif [ -d build ]; then OUT=build; else OUT=out; fi
          echo "OUT_DIR=${{ steps.locate.outputs.dir }}/$OUT" >> $GITHUB_ENV

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
