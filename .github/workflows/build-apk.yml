name: Build Android APK

on:
  workflow_dispatch:          # تشغيل يدوي
  push:
    branches: [ main, master ]
    paths:
      - 'android-project/**'
      - 'Lisan_AI_Keyboard_Full_Source/android-project/**'
      - 'extracted_source/**/android-project/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate android-project
        id: locate
        run: |
          if [ -d "android-project" ]; then
            echo "dir=android-project" >> $GITHUB_OUTPUT
          elif [ -d "Lisan_AI_Keyboard_Full_Source/android-project" ]; then
            echo "dir=Lisan_AI_Keyboard_Full_Source/android-project" >> $GITHUB_OUTPUT
          elif [ -d "extracted_source/Lisan_AI_Keyboard_Full_Source/android-project" ]; then
            echo "dir=extracted_source/Lisan_AI_Keyboard_Full_Source/android-project" >> $GITHUB_OUTPUT
          else
            echo "android-project not found. Searching..."
            find . -name "settings.gradle.kts" | head -10
            exit 1
          fi
          echo "Found project at: ${{ steps.locate.outputs.dir }}"

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            \~/.gradle/caches
            \~/.gradle/wrapper
          key: \( {{ runner.os }}-gradle- \){{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lisan-AI-Keyboard-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
