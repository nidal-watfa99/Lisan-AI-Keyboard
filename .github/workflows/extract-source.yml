name: Extract Source ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'اسم ملف الـ ZIP'
        required: true
        default: 'Lisan_AI_Keyboard_Full_Source.zip'
  push:
    paths:
      - '**.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE="${{ github.event.inputs.zip_name || 'Lisan_AI_Keyboard_Full_Source.zip' }}"
          if [ -f "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE ..."
            unzip -o "$ZIP_FILE" -d extracted_source
            echo "=== Extracted structure ==="
            find extracted_source -maxdepth 3 -type d
          else
            echo "ZIP not found. Please upload the ZIP to the repository root."
            ls -la *.zip 2>/dev/null || true
            exit 1
          fi

      - name: Upload extracted source as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-lisan-source
          path: extracted_source/
          retention-days: 5
