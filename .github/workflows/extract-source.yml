name: Extract Lisan Source

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'lisan*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Lisan ZIP file found in repo root"
            exit 1
          fi

          SIZE=$(stat -c%s "$ZIP_FILE")
          echo "Found: $ZIP_FILE ($SIZE bytes)"

          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::ZIP is only $SIZE bytes - upload was incomplete. Re-upload the real file."
            exit 1
          fi

          unzip -tq "$ZIP_FILE"
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted

          echo "Extracted files: $(find extracted -type f | wc -l)"

      - name: Upload extracted source as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lisan-source
          path: extracted/
          if-no-files-found: error
